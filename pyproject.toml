[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-ai"
version = "0.1.0"
description = "A bounded, observable AI agent orchestration platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.49,<1",
  "fastapi>=0.115,<1",
  "mcp>=1.2,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
